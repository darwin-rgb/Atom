<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atomic Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0d1a;--panel:#131833;--line:#262d55;--text:#e9ecf8;--muted:#8f98c0;--plus:#f4b860;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 0,#1b2250 0,#0a0d1a 55%) no-repeat,var(--bg);color:var(--text);
font:17px/1.55 "Newsreader",Georgia,"Times New Roman",serif;max-width:760px;margin-inline:auto;min-height:100vh}
header{padding:28px 18px 10px}
h1{font:500 34px/1.15 "Newsreader",Georgia,serif;letter-spacing:-.01em;margin:0 0 6px}
header p{margin:0;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:14px 14px 8px}
.el{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;padding:9px 11px;border-radius:14px;
border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none}
.el .n{font-size:13px;color:var(--muted)}
.el .s{font-size:30px;font-weight:500;line-height:1}
.el .m{font-size:13px;color:var(--muted)}
a.el.live{border-color:var(--plus);box-shadow:0 0 18px rgba(244,184,96,.22)}
a.el.live .s{color:var(--plus)}
a.el.live:hover,a.el.live:focus-visible{background:#1b2250;outline:none}
.el.soon{opacity:.45}
footer{padding:10px 18px 30px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<h1>Atomic Structure</h1>
<p>Choose an element to explore its electron orbitals.</p>
</header>
<div id="grid"></div>
<footer>Gold elements are ready to explore. The rest are coming soon.</footer>
<script>
// Add an element here, and set live:true once its page (e.g. helium.html) exists.
const ELEMENTS=[
["H","Hydrogen",true,"hydrogen.html"],["He","Helium",true,"helium.html"],["Li","Lithium"],["Be","Beryllium"],["B","Boron"],
["C","Carbon"],["N","Nitrogen"],["O","Oxygen"],["F","Fluorine"],["Ne","Neon"],
["Na","Sodium"],["Mg","Magnesium"],["Al","Aluminium"],["Si","Silicon"],["P","Phosphorus"],
["S","Sulfur"],["Cl","Chlorine"],["Ar","Argon"],["K","Potassium"],["Ca","Calcium"]];
const g=document.getElementById('grid');
ELEMENTS.forEach((e,i)=>{
  const live=!!e[2],c=document.createElement(live?'a':'div');
  c.className='el '+(live?'live':'soon');if(live)c.href=e[3];
  c.innerHTML=`<span class="n">${i+1}</span><span class="s">${e[0]}</span><span class="m">${e[1]}</span>`;
  g.appendChild(c);
});
</script>
</body>
</html>
